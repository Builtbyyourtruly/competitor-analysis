<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Competitor Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--surface-2:#E8ECE7;--ink:#17211F;--ink-2:#53605B;--line:#D2D9D3;
  --accent:#2B44C9;--accent-ink:#FFFFFF;--accent-soft:#E3E7FB;--ok:#1F7A5C;--warn:#9A620B;--bad:#B23A3A;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111715;--surface:#19211F;--surface-2:#232D2A;--ink:#E6ECE8;--ink-2:#9DABA5;--line:#2E3A36;
    --accent:#8E9DFF;--accent-ink:#0D1330;--accent-soft:#252C52;--ok:#5CC59A;--warn:#E0A84A;--bad:#F07A7A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111715;--surface:#19211F;--surface-2:#232D2A;--ink:#E6ECE8;--ink-2:#9DABA5;--line:#2E3A36;
  --accent:#8E9DFF;--accent-ink:#0D1330;--accent-soft:#252C52;--ok:#5CC59A;--warn:#E0A84A;--bad:#F07A7A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:2.1rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:700;margin-bottom:12px}
h3{font-size:1rem;font-weight:700;margin-bottom:6px}
p{margin:0 0 10px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.appbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:10px;white-space:nowrap}
.ws{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.ws select{width:auto;max-width:240px}
.status{font-size:.85rem;color:var(--ink-2);min-width:9ch}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
nav{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.tick{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.tick.on{background:var(--ok);border-color:var(--ok)}
main{padding:30px 34px 72px;min-width:0}
.wrap{max-width:1140px}
.lede{color:var(--ink-2);max-width:70ch;margin:8px 0 26px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.panel.flat{background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.err{color:var(--bad);font-size:.9rem;margin-top:8px}
.note{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.9rem;color:var(--ink-2)}

.btn{font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.link{border:0;background:none;padding:2px 4px;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}

input,textarea,select{font:inherit;font-size:.93rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input[type=checkbox]{width:auto}
label.f{display:block;font-weight:600;font-size:.88rem;margin-bottom:14px}
label.f > input,label.f > textarea,label.f > select{margin-top:5px;font-weight:400}
.hint{font-weight:400;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 18px}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-weight:600;color:var(--ink-2);white-space:nowrap}
tbody th{font-weight:600;color:var(--ink-2);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cmp td{min-width:180px}

.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0;flex:none}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface-2);font-size:.8rem;margin:0 4px 4px 0}
.you{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:.74rem;font-weight:600;margin-left:6px;vertical-align:1px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}

.setup{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.clist{display:flex;flex-direction:column;gap:4px}
.clist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:8px;border:1px solid transparent}
.clist button:hover{background:var(--surface-2)}
.clist button[aria-pressed="true"]{background:var(--surface);border-color:var(--line)}
.clist button:focus-visible{outline:2px solid var(--accent)}

.empty{text-align:center;padding:44px 20px}
.empty h2{font-size:1.35rem}
.empty p{color:var(--ink-2);max-width:52ch;margin:0 auto 18px}

.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.map svg{width:100%;height:auto;display:block}
.axis-pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.axis-pick label{font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px}
.axis-pick select{width:auto}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;border-top:4px solid var(--c,var(--line))}
.card ul{margin:4px 0 10px;padding-left:18px}
.card li{margin-bottom:3px}
.kv{font-size:.88rem;margin-bottom:8px}
.kv b{display:block;font-size:.78rem;color:var(--ink-2);font-weight:600}

.bars{width:100%;height:auto;display:block}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.q h3{display:flex;align-items:center;gap:8px}
.q ul{list-style:none;margin:6px 0 10px;padding:0}
.q li{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.q li:last-child{border-bottom:0}
.q .add{display:flex;gap:6px}
.q-s h3::before,.q-w h3::before,.q-o h3::before,.q-t h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--ok)}
.q-w h3::before{background:var(--bad)}
.q-o h3::before{background:var(--accent)}
.q-t h3::before{background:var(--warn)}

.gap{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.gap:last-child{border-bottom:0}
.prio{font-weight:600;font-size:.82rem;padding:3px 8px;border-radius:6px;text-align:center;align-self:start}
.prio.High{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.prio.Medium{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.prio.Low{background:var(--surface-2);color:var(--ink-2)}

.kwbox{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.kwbox textarea{min-height:120px;font-size:.86rem}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pill-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pstat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:130px}
.pstat b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.45rem;line-height:1.1}
.pstat span{font-size:.8rem;color:var(--ink-2)}

.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 36px}
.report h2{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.report h2:first-of-type{margin-top:0;padding-top:0;border-top:0}
.report .rhead{margin-bottom:22px}
.report .rhead h1{font-size:1.9rem}

.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:24px;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,15,14,.45)}
textarea.copybox{min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px}
  nav a{white-space:nowrap}
  main{padding:22px 16px 56px}
  .grid2,.grid3,.setup,.map-wrap,.stat-grid,.swot{grid-template-columns:1fr}
  .report{padding:22px 18px}
  .appbar{padding:12px 16px}
  .ws{margin-left:0;width:100%}
  h1{font-size:1.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10" cy="13" r="8" fill="none" stroke="var(--accent)" stroke-width="2.4"/><circle cx="16" cy="13" r="8" fill="none" stroke="var(--ink)" stroke-width="2.4"/></svg>
    Competitor Analysis
  </div>
  <div class="ws" id="ws"></div>
</header>
<div class="shell">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"><div class="wrap"><p class="muted">Loading your analyses…</p></div></main>
</div>

<dialog id="settings" aria-labelledby="setT">
  <h2 id="setT">AI settings</h2>
  <p class="small muted">AI analysis uses your own Anthropic API key. Get one at console.anthropic.com. The key is stored in this browser only and is never added to the repository or sent anywhere except Anthropic.</p>
  <label class="f">Anthropic API key<input id="keyIn" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
  <label class="f">Model <span class="hint">(leave as is unless you need a different one)</span><input id="modelIn"></label>
  <div class="row between"><button class="btn sm danger" data-act="clearKey">Remove key</button><span class="row"><button class="btn" data-act="closeSettings">Cancel</button><button class="btn primary" data-act="saveKey">Save</button></span></div>
</dialog>
<script>
"use strict";
/* ---------- constants ---------- */
const PALETTE=["#2B44C9","#C2851A","#1E8C7E","#9A3F86","#5B6B7C","#3F8F3A","#C24C64","#6A55C8"];
const VIEWS=[["setup","Competitors"],["positioning","Website & positioning"],["social","Social media"],["keywords","Keywords"],["gaps","Content gaps"],["swot","SWOT analysis"],["report","Comparison report"]];
const AXES={price:["Budget","Premium","Price point"],scope:["Generalist","Specialist","Focus"],delivery:["Traditional","Digital-first","Delivery"],tone:["Formal","Friendly","Tone"],scale:["Boutique","Large-scale","Scale"]};
const PLATFORMS=["Instagram","Facebook","LinkedIn","TikTok","YouTube","X","Other"];
const STOP=new Set("a about above after again all also am an and any are as at be because been before being below between both but by can could did do does doing down during each few for from further had has have having he her here hers him his how i if in into is it its itself just let me more most my no nor not now of off on once only or other our ours out over own same she should so some such than that the their theirs them then there these they this those through to too under until up very was we were what when where which while who whom why will with would you your yours yourself we're you're it's don't can't us get got make made help helps helping new one two well way within across per via etc every many much need needs like".split(" "));

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null||!isFinite(n)?"–":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e4?(n/1e3).toFixed(1)+"K":Math.round(n).toLocaleString("en-AU");
const fmt1=n=>n==null||!isFinite(n)?"–":(Math.round(n*10)/10).toLocaleString("en-AU");
const pct=n=>n==null||!isFinite(n)?"–":(n*100).toFixed(2)+"%";
const words=t=>(String(t||"").trim().match(/\S+/g)||[]).length;
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();

function blankState(name){
  return {v:1,name:name||"Untitled analysis",industry:"",market:"",competitors:[],positioning:null,
    social:{posts:[]},socialSummary:null,keywordInsights:null,gaps:null,swot:{},execSummary:null,updated:Date.now()};
}
let S=blankState();
let wsId=null;
let index=[];
const ui={view:"setup",activeComp:null,kwFilter:"all",kwSearch:"",xAxis:"price",yAxis:"scope",swotSubject:"",busy:{},err:{},pending:null,copyText:null,notice:""};

const you=()=>S.competitors.find(c=>c.isYou);
const compById=id=>S.competitors.find(c=>c.id===id);
const nameOf=c=>c?c.name||"Unnamed":"";
function nextColor(){const used=new Set(S.competitors.map(c=>c.color));return PALETTE.find(p=>!used.has(p))||PALETTE[S.competitors.length%PALETTE.length];}
function newComp(o={}){return Object.assign({id:uid(),name:"",url:"",isYou:false,color:nextColor(),tagline:"",audience:"",services:"",pricing:"",websiteCopy:"",notes:"",keywords:""},o);}

/* ---------- storage ---------- */
const store={mode:"none",col:null,saving:false,dirty:false,timer:null,status:"",
  async init(){
    let db=null,user=null;
    if(window.claude&&typeof claude.use==="function"){
      try{db=await claude.use("db");if(db)user=await claude.use("user");}catch(e){db=null;}
    }
    if(db&&user){
      try{
        const id=await user.id();
        this.col=db.collection("data/users/"+id);
        const snap=await this.col.doc("index").get();
        index=snap.exists?(snap.data().list||[]):[];
        this.mode="db";return;
      }catch(e){this.col=null;}
    }
    this.mode="local";
    try{index=JSON.parse(localStorage.getItem("ca:index")||"[]");}catch(e){index=[];}
  },
  async load(id){
    if(this.mode==="db"){
      const snap=await this.col.doc("ws_"+id).get();
      return snap.exists?JSON.parse(snap.data().data):null;
    }
    try{return JSON.parse(localStorage.getItem("ca:ws:"+id)||"null");}catch(e){return null;}
  },
  async write(id,state){
    let json=JSON.stringify(state);
    if(json.length>240000){
      const slim=JSON.parse(json);
      slim.social.posts.forEach(p=>p.caption=(p.caption||"").slice(0,60));
      json=JSON.stringify(slim);
      if(json.length>240000) throw new Error("too_big");
    }
    const entry={id,name:state.name,updated:Date.now()};
    index=[entry,...index.filter(x=>x.id!==id)];
    if(this.mode==="db"){
      await this.col.doc("ws_"+id).set({data:json,name:state.name,updated:entry.updated});
      await this.col.doc("index").set({list:index});
    }else if(this.mode==="local"){
      localStorage.setItem("ca:ws:"+id,json);
      localStorage.setItem("ca:index",JSON.stringify(index));
    }
  },
  async remove(id){
    index=index.filter(x=>x.id!==id);
    if(this.mode==="db"){await this.col.doc("ws_"+id).delete();await this.col.doc("index").set({list:index});}
    else{try{localStorage.removeItem("ca:ws:"+id);localStorage.setItem("ca:index",JSON.stringify(index));}catch(e){}}
  }
};
function scheduleSave(){
  S.updated=Date.now();store.dirty=true;
  clearTimeout(store.timer);setStatus("Unsaved changes");
  store.timer=setTimeout(flushSave,1200);
}
async function flushSave(){
  if(store.saving||!store.dirty)return;
  store.saving=true;store.dirty=false;setStatus("Saving…");
  try{
    await store.write(wsId,S);
    setStatus(store.mode==="db"?"Saved":"Saved in this browser");
    renderWs();
  }catch(e){
    setStatus(e.message==="too_big"?"Not saved: too much social data. Clear some posts.":"Not saved. Check your connection.");
  }
  store.saving=false;
  if(store.dirty)flushSave();
}
function setStatus(t){store.status=t;const el=$("#status");if(el)el.textContent=t;}

/* ---------- capabilities: AI + downloads ---------- */
let sampleFn=null,downloads=null;
const STANDALONE=!(window.claude&&typeof window.claude.use==="function");
const DEFAULT_MODEL="claude-sonnet-5-5";
function lsGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function lsSet(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k);}catch(e){}}
const apiKey=()=>lsGet("ca:apikey");
function parseLooseJSON(text){
  const t=String(text||"").trim();
  try{return JSON.parse(t);}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1]);}catch(e){}}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw {code:"invalid_json",message:"Unparseable reply"};
}
const apiSample={async json(prompt){
  const key=apiKey();if(!key)throw {code:"no_key"};
  let r;
  try{
    r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:lsGet("ca:model")||DEFAULT_MODEL,max_tokens:8000,
        messages:[{role:"user",content:prompt+"\n\nRespond with only the JSON, no other text."}]})});
  }catch(e){throw {code:"network",message:"Couldn’t reach the Anthropic API."};}
  if(!r.ok){
    let msg="";try{msg=((await r.json()).error||{}).message||"";}catch(e){}
    throw {code:r.status===401||r.status===403?"bad_key":r.status===429||r.status===529?"rate_limited":r.status===413?"prompt_too_large":r.status===404?"bad_model":"api_error",message:msg||("HTTP "+r.status)};
  }
  const data=await r.json();
  return parseLooseJSON((data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(""));
}};
const fileDownloads={async save({filename,data}){
  const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);return {status:"saved"};
}};
async function initCaps(){
  if(STANDALONE){sampleFn=apiSample;downloads=fileDownloads;return;}
  try{sampleFn=await claude.use("sample");}catch(e){sampleFn=null;}
  try{downloads=await claude.use("downloads");}catch(e){downloads=null;}
}
function errCopy(e){
  const c=e&&e.code;
  if(c==="not_granted")return "AI analysis was declined. Reload the page to be asked again.";
  if(c==="rate_limited")return "Too many requests right now. Wait a minute, then try again.";
  if(c==="invalid_json")return "The analysis came back in an unexpected format. Try again.";
  if(c==="prompt_too_large")return "There’s too much text to analyse at once. Shorten the website copy or keyword lists.";
  if(c==="cancelled")return "Analysis stopped.";
  if(c==="sampling_disabled")return "AI analysis is turned off for your account.";
  if(c==="no_key")return "Add your Anthropic API key in AI settings to use this.";
  if(c==="bad_key")return "That API key was rejected. Check it in AI settings.";
  if(c==="bad_model")return "That model name wasn’t recognised. Check it in AI settings.";

/* ---------- keywords ---------- */
function parseKw(text){
  const m=new Map();
  String(text||"").split(/\r?\n/).forEach((line,i)=>{
    const parts=line.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(s=>s.replace(/^"|"$/g,"").trim());
    const kw=norm(parts[0]);
    if(!kw||(i===0&&/^(keyword|keywords|query|search term)$/.test(kw)))return;
    const nums=parts.slice(1).map(x=>parseFloat(String(x).replace(/[^0-9.]/g,""))).filter(x=>isFinite(x));
    const prev=m.get(kw);
    const rec={kw,vol:nums[0]??null,pos:nums[1]??null};
    if(!prev||(rec.vol||0)>(prev.vol||0))m.set(kw,rec);
  });
  return m;
}
function kwData(){
  const comps=S.competitors.filter(c=>parseKw(c.keywords).size);
  const all=new Map();
  comps.forEach(c=>{parseKw(c.keywords).forEach(r=>{
    const e=all.get(r.kw)||{kw:r.kw,vol:null,by:{}};
    if(r.vol!=null)e.vol=Math.max(e.vol||0,r.vol);
    e.by[c.id]=r.pos??true;all.set(r.kw,e);
  });});
  return {comps,list:[...all.values()]};
}
function kwGapsForYou(){
  const y=you();if(!y)return [];
  const {comps,list}=kwData();
  return list.filter(k=>!k.by[y.id]&&Object.keys(k.by).length>0)
    .map(k=>({...k,count:Object.keys(k.by).length}))
    .sort((a,b)=>b.count-a.count||(b.vol||0)-(a.vol||0));
}

/* ---------- CSV + social ---------- */
function parseCSV(t){
  t=String(t||"").replace(/^\uFEFF/,"");
  const first=t.split(/\r?\n/)[0]||"";
  const cnt=ch=>first.split(ch).length;
  const d=cnt("\t")>cnt(",")?"\t":cnt(";")>cnt(",")?";":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
const COLS={account:["competitor","account","brand","page name","page","profile","handle","business","company","username"],
  platform:["platform","network","channel","social network","source"],
  date:["date","publish time","published","posted","created","time"],
  type:["post type","media type","content type","format","type"],
  likes:["likes","reactions","like count","hearts"],
  comments:["comments","comment count","replies"],
  shares:["shares","retweets","reposts","share count"],
  saves:["saves","saved","bookmarks"],
  views:["views","impressions","reach","plays","video views"],
  followers:["followers","follower count","fans","audience"],
  caption:["caption","post text","text","message","description","content","title","post"]};
function detectCols(headers){
  const h=headers.map(x=>norm(x));const map={};const used=new Set();
  for(const [k,syn] of Object.entries(COLS)){for(const s of syn){const i=h.findIndex((x,j)=>!used.has(j)&&x===s);if(i>=0){map[k]=i;used.add(i);break;}}}
  for(const [k,syn] of Object.entries(COLS)){if(map[k]!=null)continue;for(const s of syn){const i=h.findIndex((x,j)=>!used.has(j)&&x.includes(s));if(i>=0){map[k]=i;used.add(i);break;}}}
  return map;
}
function num(v){
  if(v==null)return 0;let s=String(v).trim().toLowerCase().replace(/[, ]/g,"");let m=1;
  if(s.endsWith("k")){m=1e3;s=s.slice(0,-1);}else if(s.endsWith("m")){m=1e6;s=s.slice(0,-1);}
  const n=parseFloat(s.replace(/[^0-9.\-]/g,""));return isFinite(n)?n*m:0;
}
function parseDate(v){
  if(!v)return null;const s=String(v).trim();
  const m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)?null:d.getTime();}
  const t=Date.parse(s);return isNaN(t)?null:t;
}
function startImport(text){
  const rows=parseCSV(text);
  if(rows.length<2){ui.pending={error:"That file doesn’t have a header row and at least one post. Check it’s a CSV export."};render();return;}
  const headers=rows[0];const map=detectCols(headers);
  const body=rows.slice(1);
  let accounts=[];const assign={};
  if(map.account!=null){
    accounts=[...new Set(body.map(r=>String(r[map.account]||"").trim()).filter(Boolean))];
    accounts.forEach(a=>{const c=matchName(a);assign[a]=c?c.id:"";});
  }
  const missing=["likes","comments","date"].filter(k=>map[k]==null);
  ui.pending={headers,map,body,accounts,assign,fixedComp:"",platform:"Instagram",missing};
  render();
}
function commitImport(){
  const p=ui.pending;if(!p||p.error)return;
  const g=(r,k)=>p.map[k]!=null?r[p.map[k]]:"";
  let added=0;
  p.body.forEach(r=>{
    const cid=p.map.account!=null?p.assign[String(g(r,"account")).trim()]:p.fixedComp;
    if(!cid)return;
    S.social.posts.push({c:cid,platform:String(g(r,"platform")||p.platform).trim()||p.platform,date:parseDate(g(r,"date")),
      type:String(g(r,"type")||"Post").trim(),likes:num(g(r,"likes")),comments:num(g(r,"comments")),shares:num(g(r,"shares")),
      saves:num(g(r,"saves")),views:num(g(r,"views")),followers:num(g(r,"followers")),caption:String(g(r,"caption")||"").slice(0,220)});
    added++;
  });
  if(S.social.posts.length>3000)S.social.posts=S.social.posts.slice(-3000);
  ui.pending=null;ui.notice=`Added ${added} post${added===1?"":"s"}.`;
  scheduleSave();render();
}
const eng=p=>p.likes+p.comments+p.shares+p.saves;
function countBy(arr,k){const m={};arr.forEach(x=>{const v=x[k]||"Other";m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function socialStats(){
  const by={};S.social.posts.forEach(p=>(by[p.c]=by[p.c]||[]).push(p));
  return S.competitors.map(c=>{
    const ps=by[c.id]||[];if(!ps.length)return {c,n:0};
    const dates=ps.map(p=>p.date).filter(Boolean);
    let weeks=1;if(dates.length>1)weeks=Math.max(1,(Math.max(...dates)-Math.min(...dates))/(7*864e5));
    const tot=ps.reduce((a,p)=>a+eng(p),0);const avg=tot/ps.length;
    const fol=ps.map(p=>p.followers).filter(x=>x>0);const followers=fol.length?Math.max(...fol):0;
    const vws=ps.map(p=>p.views).filter(x=>x>0);
    return {c,n:ps.length,perWeek:ps.length/weeks,avg,followers,rate:followers?avg/followers:null,
      avgViews:vws.length?vws.reduce((a,b)=>a+b,0)/vws.length:null,
      plat:countBy(ps,"platform"),type:countBy(ps,"type"),
      top:[...ps].sort((a,b)=>eng(b)-eng(a)).slice(0,3)};
  });
}

/* ---------- text analysis ---------- */
function topWords(text,n=10){
  const m={};(String(text||"").toLowerCase().match(/[a-z][a-z'\-]{2,}/g)||[]).forEach(w=>{if(!STOP.has(w))m[w]=(m[w]||0)+1;});
  return Object.entries(m).filter(e=>e[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

/* ---------- charts ---------- */
function barChart(rows,valFmt){
  rows=rows.filter(r=>r.value!=null&&isFinite(r.value));
  if(!rows.length)return `<p class="muted small">No data yet.</p>`;
  const max=Math.max(...rows.map(r=>r.value),1);const rh=34,lw=140,w=520,bw=w-lw-70;

  ${rows.map((r,i)=>{const y=i*rh+4;const bl=Math.max(2,r.value/max*bw);
    return `<text x="0" y="${y+19}" font-size="13" fill="var(--ink)">${esc(r.label.length>18?r.label.slice(0,17)+"…":r.label)}</text>
    <rect x="${lw}" y="${y+5}" width="${bl}" height="20" rx="4" fill="${r.color}"/>
    <text x="${lw+bl+8}" y="${y+19}" font-size="13" fill="var(--ink-2)">${esc(valFmt(r.value))}</text>`;}).join("")}
  </svg>`;
}
function positionMap(){

    return {c,x:+r.scores[xa]||5.5,y:+r.scores[ya]||5.5};}).filter(Boolean);
  const seen={};pts.forEach(p=>{const k=p.x+"_"+p.y;seen[k]=(seen[k]||0)+1;if(seen[k]>1){p.x+=0.28*(seen[k]-1);p.y-=0.22*(seen[k]-1);}});

    <rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="var(--surface-2)" rx="10"/>
    <line x1="${W/2}" y1="${pad}" x2="${W/2}" y2="${H-pad}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5"/>
    <line x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="${pad}" y="${H-pad+26}" font-size="13" fill="var(--ink-2)">← ${esc(AXES[xa][0])}</text>
    <text x="${W-pad}" y="${H-pad+26}" font-size="13" fill="var(--ink-2)" text-anchor="end">${esc(AXES[xa][1])} →</text>
    <text x="${pad-14}" y="${H-pad}" font-size="13" fill="var(--ink-2)" transform="rotate(-90 ${pad-14} ${H-pad})">← ${esc(AXES[ya][0])}</text>
    <text x="${pad-14}" y="${pad}" font-size="13" fill="var(--ink-2)" text-anchor="end" transform="rotate(-90 ${pad-14} ${pad})">${esc(AXES[ya][1])} →</text>
    ${pts.map(p=>{const x=sx(p.x),y=sy(p.y);const right=x<W-180;
      return `<g>${p.c.isYou?`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="${p.c.color}" stroke-width="2"/>`:""}

  return table+ai;

function vReport(){
  const head=`<h1>Comparison report</h1><p class="lede">Everything you’ve gathered in one report. Add an executive summary, then download it to share with your team or client.</p>`;
  const nc=needComps();if(nc)return head+nc;
  const actions=`<div class="panel"><div class="row">${aiBtn("exec",S.execSummary?"Rewrite executive summary":"Write executive summary")}
    ${downloads?`<button class="btn" data-act="dlHtml">Download report (HTML)</button><button class="btn" data-act="dlMd">Download as Markdown</button>`:""}
    <button class="btn" data-act="copyMd">Copy as Markdown</button></div>
    ${ui.copyText?`<p class="small muted" style="margin-top:10px">Copying isn’t allowed here, so select all the text below and copy it.</p><textarea class="copybox" readonly>${esc(ui.copyText)}</textarea>`:""}
    ${ui.notice?`<p class="small" style="color:var(--ok);margin-top:8px" role="status">${esc(ui.notice)}</p>`:""}</div>`;
  return head+actions+`<article class="report">${reportHTML()}</article>`;
}
function reportHTML(){
  const cs=S.competitors;const y=you();
  const date=new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
  let h=`<div class="rhead"><h1>${esc(S.name)}</h1><p class="muted">${[S.industry,S.market,date].filter(Boolean).map(esc).join(", ")}</p></div>`;
  if(S.execSummary){const E=S.execSummary;h+=`<h2>Executive summary</h2><p>${esc(E.summary)}</p>${(E.priorities||[]).length?`<h3>Priorities</h3><ol>${E.priorities.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>`:""}`;}
  h+=`<h2>Businesses compared</h2><div class="scroll"><table><thead><tr><th>Business</th><th>Website</th><th>Headline</th><th>Audience</th></tr></thead><tbody>${cs.map(c=>`<tr><td><span class="sw" style="background:${c.color}"></span>${esc(nameOf(c))}${c.isYou?" (you)":""}</td><td>${esc(c.url||"–")}</td><td>${esc(c.tagline||"–")}</td><td>${esc(c.audience||"–")}</td></tr>`).join("")}</tbody></table></div>`;
  if(S.positioning){const P=S.positioning;
    h+=`<h2>Positioning</h2><p>${esc(P.summary||"")}</p>${P.whitespace?`<p><b>Open territory:</b> ${esc(P.whitespace)}</p>`:""}<div class="map" style="max-width:620px">${positionMap()}</div>
    <div class="scroll"><table><thead><tr><th>Business</th><th>Positioning</th><th>Value proposition</th><th>Tone</th></tr></thead><tbody>${cs.filter(c=>P.results[c.id]).map(c=>{const r=P.results[c.id];return `<tr><td>${esc(nameOf(c))}</td><td>${esc(r.positioning)}</td><td>${esc(r.valueProp)}</td><td>${esc(r.tone)}</td></tr>`;}).join("")}</tbody></table></div>`;}
  const st=socialStats().filter(s=>s.n);
  if(st.length){h+=`<h2>Social media</h2>${S.socialSummary?`<p>${esc(S.socialSummary.summary)}</p>`:""}<div class="scroll"><table><thead><tr><th>Business</th><th class="num">Posts</th><th class="num">Posts / week</th><th class="num">Avg engagement</th><th class="num">Engagement rate</th><th>Main platform</th></tr></thead><tbody>${st.map(s=>`<tr><td>${esc(nameOf(s.c))}</td><td class="num">${s.n}</td><td class="num">${fmt1(s.perWeek)}</td><td class="num">${fmt(s.avg)}</td><td class="num">${pct(s.rate)}</td><td>${esc(s.plat[0][0])}</td></tr>`).join("")}</tbody></table></div>
    ${S.socialSummary&&(S.socialSummary.recommendations||[]).length?`<h3>Social recommendations</h3><ul>${S.socialSummary.recommendations.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}`;}
  const {comps,list}=kwData();
  if(comps.length>=2){h+=`<h2>Keywords</h2><p>${list.length} unique keywords across ${comps.length} businesses; ${list.filter(k=>Object.keys(k.by).length===comps.length).length} shared by all.${y&&comps.includes(y)?` ${kwGapsForYou().length} keywords are targeted by competitors but not by ${esc(nameOf(y))}.`:""}</p>
    ${S.keywordInsights?`<p>${esc(S.keywordInsights.summary||"")}</p><ul>${(S.keywordInsights.opportunities||[]).slice(0,8).map(o=>`<li><b>${esc(o.keyword)}</b>: ${esc(o.why)} Suggested: ${esc(o.suggestedPage)}</li>`).join("")}</ul>`:""}`;}
  if(S.gaps&&(S.gaps.items||[]).length){h+=`<h2>Content gaps</h2><p>${esc(S.gaps.summary||"")}</p><ul>${S.gaps.items.map(i=>`<li><b>${esc(i.topic)}</b> (${esc(i.priority)}): ${esc(i.why)}${(i.ideas||[]).length?` Ideas: ${i.ideas.map(d=>esc(d.format+": "+d.title)).join("; ")}.`:""}</li>`).join("")}</ul>`;}
  const sws=cs.filter(c=>S.swot[c.id]);
  sws.forEach(c=>{const sw=S.swot[c.id];h+=`<h2>SWOT: ${esc(nameOf(c))}</h2><div class="swot">${QUADS.map(([k,l,cls])=>`<div class="q ${cls}"><h3>${l}</h3><ul>${(sw[k]||[]).map(t=>`<li><span class="small">${esc(t)}</span></li>`).join("")}</ul></div>`).join("")}</div>`;});
  return h;
}
function promptExec(){
  const st=socialStats().filter(s=>s.n).map(s=>`${nameOf(s.c)}: ${s.n} posts, ${fmt1(s.perWeek)}/wk, avg engagement ${Math.round(s.avg)}`).join("; ");
  return `You are a marketing strategist writing for a business owner. ${marketLine()} The user's business: ${you()?nameOf(you()):"not specified"}.
Businesses: ${S.competitors.map(c=>nameOf(c)+(c.isYou?" (user)":"")).join(", ")}
Positioning: ${S.positioning?JSON.stringify({summary:S.positioning.summary,whitespace:S.positioning.whitespace}):"not analysed"}
Social: ${st||"no data"} ${S.socialSummary?S.socialSummary.summary:""}
Keywords: ${S.keywordInsights?S.keywordInsights.summary:"not analysed"}
Content gaps: ${S.gaps?(S.gaps.items||[]).map(i=>i.topic+" ("+i.priority+")").join("; "):"not analysed"}
SWOT: ${JSON.stringify(S.swot[you()?.id]||{})}

Reply with only JSON: {"summary":"one paragraph, 4-6 sentences, plain language","priorities":["4-6 specific, actionable priorities in order"]}. Use Australian English.`;
}
function reportMarkdown(){
  const cs=S.competitors;const L=[];
  L.push(`# ${S.name}`,"",[S.industry,S.market,new Date().toLocaleDateString("en-AU")].filter(Boolean).join(", "),"");
  if(S.execSummary){L.push("## Executive summary","",S.execSummary.summary,"");(S.execSummary.priorities||[]).forEach((p,i)=>L.push(`${i+1}. ${p}`));L.push("");}
  L.push("## Businesses compared","","| Business | Website | Headline | Audience |","|---|---|---|---|");
  cs.forEach(c=>L.push(`| ${nameOf(c)}${c.isYou?" (you)":""} | ${c.url||"–"} | ${(c.tagline||"–").replace(/\|/g,"/")} | ${(c.audience||"–").replace(/\|/g,"/")} |`));L.push("");
  if(S.positioning){L.push("## Positioning","",S.positioning.summary||"","");if(S.positioning.whitespace)L.push(`**Open territory:** ${S.positioning.whitespace}`,"");
    cs.forEach(c=>{const r=S.positioning.results[c.id];if(r)L.push(`### ${nameOf(c)}`,"",`- Positioning: ${r.positioning}`,`- Value proposition: ${r.valueProp}`,`- Tone: ${r.tone}`,...(r.differentiators||[]).map(d=>`- Differentiator: ${d}`),"");});}
  const st=socialStats().filter(s=>s.n);
  if(st.length){L.push("## Social media","");if(S.socialSummary)L.push(S.socialSummary.summary,"");L.push("| Business | Posts | Posts/week | Avg engagement | Engagement rate |","|---|---|---|---|---|");st.forEach(s=>L.push(`| ${nameOf(s.c)} | ${s.n} | ${fmt1(s.perWeek)} | ${fmt(s.avg)} | ${pct(s.rate)} |`));L.push("");}
  if(S.keywordInsights){L.push("## Keyword opportunities","",S.keywordInsights.summary||"","");(S.keywordInsights.opportunities||[]).forEach(o=>L.push(`- **${o.keyword}** (${o.intent}): ${o.why} Suggested: ${o.suggestedPage}`));L.push("");}
  if(S.gaps){L.push("## Content gaps","",S.gaps.summary||"","");(S.gaps.items||[]).forEach(i=>{L.push(`- **${i.topic}** (${i.priority}): ${i.why}`);(i.ideas||[]).forEach(d=>L.push(`  - ${d.format}: ${d.title}`));});L.push("");}
  cs.filter(c=>S.swot[c.id]).forEach(c=>{L.push(`## SWOT: ${nameOf(c)}`,"");QUADS.forEach(([k,l])=>{L.push(`### ${l}`);(S.swot[c.id][k]||[]).forEach(t=>L.push(`- ${t}`));L.push("");});});
  return L.join("\n");
}
function reportDoc(){
  return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.name)}</title>
<style>:root{--surface:#fff;--surface-2:#EEF1ED;--ink:#17211F;--ink-2:#53605B;--line:#D2D9D3;--accent:#2B44C9;--ok:#1F7A5C;--warn:#9A620B;--bad:#B23A3A}
body{font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);max-width:960px;margin:40px auto;padding:0 24px}
h1,h2,h3{line-height:1.2}h2{margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right}.muted{color:var(--ink-2)}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}.q{border:1px solid var(--line);border-radius:10px;padding:12px}.q ul{padding-left:18px}.small{font-size:14px}svg{max-width:100%;height:auto}</style></head><body>${reportHTML()}</body></html>`;
}

function loadExample(){
  S=blankState("Example: Melbourne bookkeeping");S.industry="Small business bookkeeping and BAS";S.market="Melbourne, VIC";
  const a=newComp({name:"Northbank Bookkeeping",isYou:true,url:"northbankbooks.example",tagline:"Bookkeeping for Melbourne tradies and cafés",audience:"Sole traders and small hospitality businesses",services:"Bookkeeping, BAS lodgement, payroll, Xero setup",pricing:"From $290 per month",websiteCopy:"We keep your books tidy so you can get back to the tools. Our Melbourne bookkeepers specialise in trades and hospitality. Monthly bookkeeping, BAS lodgement and payroll, all done in Xero. Friendly, local and on time, every quarter. Book a free chat with our team.",keywords:"bookkeeper melbourne, 1300, 14\nbas agent melbourne, 590, 22\nxero bookkeeping, 880, 31\nbookkeeping for tradies, 210, 6\npayroll services small business, 480, 40"});
  S.competitors.push(a);
  const b=newComp({name:"Ledgerline Accounting",url:"ledgerline.example",tagline:"Accounting, tax and advisory for growing businesses",audience:"Established SMEs with 10–50 staff",services:"Tax returns, BAS, bookkeeping, CFO advisory, cash flow forecasting, business structuring",pricing:"Fixed-fee packages from $650 per month",websiteCopy:"Ledgerline helps growing businesses make better decisions with clear numbers. Our CPA-qualified team handles tax, BAS and bookkeeping, and our advisory service gives you a part-time CFO. Cash flow forecasting, budgeting and business structuring. Read our guides on tax planning and end of financial year checklists. Fixed fees, no surprises.",keywords:"accountant melbourne, 4400, 9\nbookkeeper melbourne, 1300, 5\nbas agent melbourne, 590, 7\ntax planning small business, 720, 4\nend of financial year checklist, 1600, 3\ncash flow forecast template, 900, 2\nvirtual cfo, 480, 11"});
  S.competitors.push(b);
  const c=newComp({name:"Brightside Tax Co",url:"brightsidetax.example",tagline:"Tax and BAS made easy, fully online",audience:"Freelancers, creatives and new businesses",services:"Online tax returns, BAS, ABN registration, bookkeeping app setup",pricing:"Tax returns from $149; BAS from $99 per quarter",websiteCopy:"No paperwork, no jargon. Brightside Tax Co does your tax and BAS online in minutes. Perfect for freelancers, creatives and side hustlers. Upload your receipts in our app, get a fixed quote and we lodge for you. Watch our TikToks for quick tax tips every week.",keywords:"online tax return, 6600, 12\nbas agent melbourne, 590, 15\nabn registration, 8100, 9\ntax deductions for freelancers, 1000, 2\nbookkeeper melbourne, 1300, 25\nside hustle tax, 390, 1"});
  S.competitors.push(c);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const mk=(comp,n,plat,types,base,fol,caps)=>{for(let i=0;i<n;i++){const d=Date.now()-i*(56/n)*864e5;const m=0.4+rnd()*1.6;

  mk(b,16,["LinkedIn","Facebook"],["Image","Article","Video"],45,5200,["EOFY checklist for business owners","How to read a cash flow forecast","Team news: welcome to our new CPA","Should you restructure as a company?"]);
  mk(c,32,["TikTok","Instagram"],["Reel","Video"],310,18000,["Can you claim your laptop? Yes, here’s how","Freelancer tax mistake #1","What an ABN actually is","Side hustle? Watch this before June 30"]);
  ui.activeComp=a.id;ui.swotSubject=a.id;
  scheduleSave();
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  if(t.tagName==="SELECT"||t.type==="file"||t.type==="checkbox"||t.type==="search")return;
  if(a==="addComp"){
    const isY=t.dataset.you==="1"&&!you();
    const c=newComp({isYou:isY,name:isY?"My business":`Competitor ${S.competitors.filter(x=>!x.isYou).length+1}`});
    S.competitors.push(c);ui.activeComp=c.id;scheduleSave();render();
    const inp=document.querySelector(`[data-bind="comp.${c.id}.name"]`);if(inp){inp.focus();inp.select();}
  }
  else if(a==="pickComp"){ui.activeComp=t.dataset.id;render();}
  else if(a==="delComp"){const c=compById(t.dataset.id);if(!confirm(`Remove ${nameOf(c)} and all its data?`))return;
    S.competitors=S.competitors.filter(x=>x.id!==c.id);S.social.posts=S.social.posts.filter(p=>p.c!==c.id);delete S.swot[c.id];if(S.positioning)delete S.positioning.results[c.id];scheduleSave();render();}
  else if(a==="example"){loadExample();render();}
  else if(a==="ai"){
    const k=t.dataset.key;
    if(k==="positioning")runAI(k,promptPositioning(),out=>{const results={};(out.competitors||[]).forEach(r=>{const c=matchName(r.name);if(c)results[c.id]=r;});S.positioning={results,summary:out.summary,whitespace:out.whitespace};});
    if(k==="social")runAI(k,promptSocial(),out=>{S.socialSummary=out;});
    if(k==="keywords")runAI(k,promptKeywords(),out=>{S.keywordInsights=out;});
    if(k==="gaps")runAI(k,promptGaps(),out=>{S.gaps=out;});
    if(k==="swot"){const id=ui.swotSubject;runAI(k,promptSwot(),out=>{S.swot[id]={strengths:out.strengths||[],weaknesses:out.weaknesses||[],opportunities:out.opportunities||[],threats:out.threats||[]};});}
    if(k==="exec")runAI(k,promptExec(),out=>{S.execSummary=out;});
  }
  else if(a==="togglePaste"){$("#pasteBox").classList.toggle("hidden");}
  else if(a==="pasteImport"){startImport($("#pasteArea").value);}
  else if(a==="commitImport"){commitImport();}
  else if(a==="cancelImport"){ui.pending=null;render();}
  else if(a==="clearSocial"){const c=compById(t.dataset.id);if(!confirm(`Clear all social posts for ${nameOf(c)}?`))return;S.social.posts=S.social.posts.filter(p=>p.c!==c.id);scheduleSave();render();}
  else if(a==="tmpl"){save("competitor-social-template.csv","Competitor,Platform,Date,Post type,Likes,Comments,Shares,Saves,Views,Followers,Caption\nExample Co,Instagram,14/10/2026,Reel,120,8,4,10,2400,3500,\"Five EOFY tips\"\n","text/csv");}
  else if(a==="blankSwot"){S.swot[ui.swotSubject]={strengths:[],weaknesses:[],opportunities:[],threats:[]};scheduleSave();render();}
  else if(a==="swotDel"){S.swot[ui.swotSubject][t.dataset.q].splice(+t.dataset.i,1);scheduleSave();render();}
  else if(a==="swotAdd"){const inp=document.querySelector(`[data-swot-add="${t.dataset.q}"]`);const v=inp.value.trim();if(!v)return;S.swot[ui.swotSubject][t.dataset.q].push(v);scheduleSave();render();const n=document.querySelector(`[data-swot-add="${t.dataset.q}"]`);if(n)n.focus();}
  else if(a==="aiSettings"){openSettings();}
  else if(a==="saveKey"){lsSet("ca:apikey",$("#keyIn").value.trim());lsSet("ca:model",$("#modelIn").value.trim()===DEFAULT_MODEL?"":$("#modelIn").value.trim());$("#settings").close();ui.err={};render();}
  else if(a==="clearKey"){lsSet("ca:apikey","");$("#keyIn").value="";$("#settings").close();render();}
  else if(a==="closeSettings"){$("#settings").close();}
  else if(a==="backup"){save(slug()+"-backup.json",JSON.stringify(S,null,1),"application/json");}
  else if(a==="dlHtml"){save(slug()+".html",reportDoc(),"text/html");}
  else if(a==="dlMd"){save(slug()+".md",reportMarkdown(),"text/markdown");}
  else if(a==="copyMd"){const md=reportMarkdown();try{await navigator.clipboard.writeText(md);ui.copyText=null;flash("Report copied as Markdown.");}catch(err){ui.copyText=md;render();}}
  else if(a==="newWs"){await flushSave();wsId=uid();S=blankState();ui.activeComp=null;ui.swotSubject="";ui.pending=null;location.hash="setup";await store.write(wsId,S).catch(()=>{});setStatus(store.mode==="db"?"Saved":"Saved in this browser");renderWs();render();}
  else if(a==="delWs"){if(!confirm(`Delete “${S.name}” for good?`))return;await store.remove(wsId).catch(()=>{});await openWs(index[0]?index[0].id:null);}
});
function openSettings(){$("#keyIn").value=apiKey();$("#modelIn").value=lsGet("ca:model")||DEFAULT_MODEL;$("#settings").showModal();}
function slug(){return (S.name||"competitor-report").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"competitor-report";}
function flash(msg){ui.notice=msg;render();setTimeout(()=>{if(ui.notice===msg){ui.notice="";render();}},3500);}
async function save(filename,data,type){
  if(!downloads)return;
  try{const r=await downloads.save({filename,data:new Blob([data],{type})});if(r&&r.status==="saved")flash(`Downloaded ${filename}.`);}
  catch(e){if(e&&e.code==="unavailable"){downloads=null;render();}else if(e&&e.code!=="declined"&&e.code!=="cancelled")flash("Download failed. Try “Copy as Markdown” instead.");}
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bind){
    const [kind,id,field]=t.dataset.bind.split(".");
    if(kind==="meta")S[id]=t.value;
    else if(kind==="comp"){const c=compById(id);if(c)c[field]=t.value;}
    scheduleSave();
    if(t.dataset.kw){clearTimeout(window.__kwT);window.__kwT=setTimeout(()=>{const o=$("#kwOut");if(o)o.innerHTML=kwResults();
      const box=t.closest(".kwbox");if(box){const c=compById(id);box.querySelector(".row .muted").textContent=parseKw(c.keywords).size+" keywords";}renderNav();},400);}
  }
  if(t.dataset.act==="kwSearch"){ui.kwSearch=t.value;clearTimeout(window.__kwS);window.__kwS=setTimeout(()=>{const o=$("#kwOut");if(o){o.innerHTML=kwResults();const s=o.querySelector('[data-act="kwSearch"]');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}}},250);}
});
document.addEventListener("change",async e=>{
  const t=e.target;const a=t.dataset.act;
  if(t.dataset.bind&&t.dataset.rerender){if(t.dataset.bind==="meta.name")renderWs();render();return;}
  if(a==="setYou"){S.competitors.forEach(c=>c.isYou=t.checked&&c.id===t.dataset.id);scheduleSave();render();}
  else if(a==="axis"){ui[t.dataset.axis==="x"?"xAxis":"yAxis"]=t.value;render();}
  else if(a==="csvFile"&&t.files[0]){ui.notice="";startImport(await t.files[0].text());}
  else if(a==="kwFile"&&t.files[0]){
    const rows=parseCSV(await t.files[0].text());if(!rows.length)return;
    const h=rows[0].map(norm);const ki=Math.max(0,h.findIndex(x=>/keyword|query|term/.test(x)));
    const vi=h.findIndex(x=>/volume|impressions|searches/.test(x));const pi=h.findIndex(x=>/position|rank/.test(x));
    const body=(h.some(x=>/keyword|query|term/.test(x))?rows.slice(1):rows);
    const c=compById(t.dataset.id);
    const lines=body.map(r=>[r[ki],vi>=0?r[vi]:"",pi>=0?r[pi]:""].map(x=>String(x||"").replace(/,/g,"")).join(", ").replace(/(, )+$/,""));
    c.keywords=(c.keywords.trim()?c.keywords.trim()+"\n":"")+lines.join("\n");scheduleSave();render();
  }
  else if(a==="restore"&&t.files[0]){
    try{const st=JSON.parse(await t.files[0].text());if(!st||!Array.isArray(st.competitors))throw 0;
      await flushSave();wsId=uid();S=Object.assign(blankState(),st);S.social=S.social||{posts:[]};S.swot=S.swot||{};
      ui.activeComp=null;ui.swotSubject="";scheduleSave();renderWs();flash(`Restored “${S.name}”.`);}
    catch(e){flash("That file isn’t an analysis backup.");}
  }
  else if(a==="assign"){ui.pending.assign[t.dataset.acct]=t.value;render();}
  else if(a==="fixedComp"){ui.pending.fixedComp=t.value;render();}
  else if(a==="impPlatform"){ui.pending.platform=t.value;}
  else if(a==="kwFilter"){ui.kwFilter=t.value;const o=$("#kwOut");if(o)o.innerHTML=kwResults();}
  else if(a==="swotSubject"){ui.swotSubject=t.value;ui.err.swot=null;render();}
  else if(a==="switchWs"){await flushSave();await openWs(t.value);}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset.swotAdd){e.preventDefault();document.querySelector(`[data-act="swotAdd"][data-q="${e.target.dataset.swotAdd}"]`).click();}
});
function readHash(){const h=location.hash.slice(1);ui.view=VIEWS.some(v=>v[0]===h)?h:"setup";ui.notice="";ui.copyText=null;}
window.addEventListener("hashchange",()=>{readHash();render();window.scrollTo(0,0);});

/* ---------- boot ---------- */
async function openWs(id){
  if(id){
    try{const st=await store.load(id);if(st){S=Object.assign(blankState(),st);S.social=S.social||{posts:[]};S.swot=S.swot||{};wsId=id;}else{wsId=id;S=blankState();}}
    catch(e){setStatus("Couldn’t open that analysis.");return;}
  }else{wsId=uid();S=blankState();}
  ui.activeComp=null;ui.swotSubject="";ui.pending=null;ui.err={};
  setStatus(store.mode==="db"?"Saved":store.mode==="local"?"Saved in this browser":"");
  renderWs();render();
}
(async function boot(){
  readHash();
  let settled=false;
  const timer=setTimeout(()=>{if(!settled){settled=true;store.mode="local";try{index=JSON.parse(localStorage.getItem("ca:index")||"[]");}catch(e){index=[];}openWs(index[0]?index[0].id:null);}},10000);
  await Promise.all([store.init(),initCaps()]);
  if(settled){render();return;}
  settled=true;clearTimeout(timer);
  await openWs(index[0]?index[0].id:null);
})();
</script>
